services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comyc-bootstrap
    command: ["node", "-r", "relay", "-p", "6969", "-c", "-B"]
    networks:
      comyc-net:
        ipv4_address: 10.10.0.10
    ports:
      - "6969:6969/udp"
    restart: unless-stopped

  relay-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comyc-relay-1
    depends_on:
      - bootstrap
    command: ["node", "-r", "relay", "-p", "7001", "-b", "10.10.0.10", "--bootstrap-port", "6969", "-c"]
    networks:
      comyc-net:
        ipv4_address: 10.10.0.11
    restart: unless-stopped

  relay-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comyc-relay-2
    depends_on:
      - bootstrap
    command: ["node", "-r", "relay", "-p", "7002", "-b", "10.10.0.10", "--bootstrap-port", "6969", "-c"]
    networks:
      comyc-net:
        ipv4_address: 10.10.0.12
    restart: unless-stopped

  relay-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comyc-relay-3
    depends_on:
      - bootstrap
    command: ["node", "-r", "relay", "-p", "7003", "-b", "10.10.0.10", "--bootstrap-port", "6969", "-c"]
    networks:
      comyc-net:
        ipv4_address: 10.10.0.13
    restart: unless-stopped

  relay-4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comyc-relay-4
    depends_on:
      - bootstrap
    command: ["node", "-r", "relay", "-p", "7004", "-b", "10.10.0.10", "--bootstrap-port", "6969", "-c"]
    networks:
      comyc-net:
        ipv4_address: 10.10.0.14
    restart: unless-stopped

  exit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comyc-exit
    depends_on:
      - bootstrap
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    command: ["node", "-r", "exit", "-p", "8001", "-b", "10.10.0.10", "--bootstrap-port", "6969", "-c"]
    networks:
      comyc-net:
        ipv4_address: 10.10.0.20
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comyc-client
    depends_on:
      - bootstrap
      - relay-1
      - relay-2
      - relay-3
      - relay-4
      - exit
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "7777:7777"
    devices:
      - /dev/net/tun:/dev/net/tun
    command: ["node", "-r", "client-relay", "-b", "10.10.0.10", "--bootstrap-port", "6969", "-c"]
    networks:
      comyc-net:
        ipv4_address: 10.10.0.30
    restart: unless-stopped

networks:
  comyc-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1